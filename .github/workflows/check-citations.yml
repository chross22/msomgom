name: Check citations

on:
  schedule:
    # first of every month, 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

jobs:
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Run citation check
        id: check
        run: |
          Rscript inst/scripts/check_citations.R | tee citation_check_output.txt
        continue-on-error: true

      - name: Record result
        id: result
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update an issue if citations need review
        if: steps.result.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "The scheduled citation check found something to review in [README.md](../../blob/main/README.md#references)."
            echo
            echo '```'
            cat citation_check_output.txt
            echo '```'
            echo
            echo "Update the citation (and, for versioned packages, the recorded year in \`inst/scripts/check_citations.R\`) once reviewed."
          } > "$BODY_FILE"

          existing=$(gh issue list --search "Citations need review in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file "$BODY_FILE"
          else
            gh issue create --title "Citations need review" --body-file "$BODY_FILE" --label documentation
          fi

      - name: Close the tracking issue if everything's current again
        if: steps.result.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Citations need review in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Citation check is passing again as of this run."
            gh issue close "$existing"
          fi
